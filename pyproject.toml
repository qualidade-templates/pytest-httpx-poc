[project]
name = "pytest-httpx-poc"
version = "1.0.0"
description = "POC ServeRest com Pytest + HTTPX — mesmos fluxos do pactum-js-poc"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.0",
  "python-dotenv>=1.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-html>=4.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "*_spec.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
